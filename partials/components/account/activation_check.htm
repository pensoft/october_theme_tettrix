{% if not user.is_activated %}

    <h2>Your email address has not yet been verified.</h2>
    <p>
        You should verify your account otherwise it may be deleted. Please check your email to verify.
        {# A button, not an empty anchor - it triggers a request, it does not navigate. #}
        <button type="button" class="link-button" data-request="onSendActivationEmail">Send the verification email again</button>.
    </p>

{% endif %}
