<form method="post" data-request="onUpdate" data-request-files data-request-flash>
    <div class="ui form">
        <div class="form-error-summary" tabindex="-1"></div>
        <div class="fields">
            <div class="field">
                <label for="accountName">First Name</label>
                <input name="name" type="text" class="" id="accountName" value="{{ user.name }}">
            </div>
            <div class="field">
                <label for="accountLastName">Last Name</label>
                <input name="surname" type="text" class="" id="accountLastName" value="{{ user.surname }}">
            </div>

            <div class="field">
                <label for="accountEmail">Email</label>
                <input name="email" type="email" class="" id="accountEmail" value="{{ user.email }}">
            </div>

            <div class="field">
                {% if user.avatar %}

                <div id="userAvatar">
                    <img alt="Current avatar for {{ user.name }} {{ user.surname }}" src="{{user.avatar.getThumb(70,70, { mode : 'crop' } )}}" style="border-radius: 50%;" width="70" height="70">
                    {# alt is not a valid attribute on <a>; the control is a
                       button with a real accessible name. #}
                    <button type="button" class="link-button upload-remove-button" data-request="onRemoveAttachmentHandler" data-request-confirm="Are you sure?" data-request-data="file_id: {{user.avatar.id}}" style="color: #9D6A6A;" aria-label="Delete avatar"><span aria-hidden="true">X</span></button>
                </div>
                {% endif %}
                <label for="accountAvatar">Avatar</label>
                <input name="avatar" type="file" class="" id="accountAvatar" value="{{ user.avatar.file_name }}" accept="image/*">
            </div>

            <div class="field">
                <label for="accountPassword">New Password</label>
                <input name="password" type="password" class="" id="accountPassword">
            </div>

            <div class="field">
                <label for="accountPasswordConfirm">Confirm New Password</label>
                <input name="password_confirmation" type="password" class="" id="accountPasswordConfirm">
            </div>

            {% if updateRequiresPassword %}
            <p>To change these details, please confirm your current password.</p>
            <div class="field">
                <label for="accountPasswordCurrent">Current Password <span class="field-required-marker" aria-hidden="true">*</span></label>
                <input name="password_current" type="password" class="" id="accountPasswordCurrent" required autocomplete="current-password">
            </div>
            {% endif %}

            <div class="mt-1">
                <div class="row middle-xs">
                    <div class="col-md-2 col-xs-6 center-xs">
                        <button type="submit" class="btn btn-primary btn-slide-plain">Save</button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</form>
